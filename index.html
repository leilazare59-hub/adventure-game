    spawn("lavaworm", cfg.lavawormCount);
    spawn("marsbat", cfg.marsBatCount);

    // میوه‌ها (در فضا میوه نداریم)
    if (!cfg.space) for (let x = 250; x < LEVEL_LENGTH; x += 300 + Math.random() * 200) {
        if (isInPit(x, currentPits)) continue;
        if (pipes.some(p => Math.abs(p.x - x) < 36) || blocks.some(b => Math.abs(b.x - x) < 28)) continue;
        if (caveAt(x) && inHole(caveAt(x), x)) continue;
        fruits.push({ x, y: baseGroundHeightAt(x) - 55 - Math.random() * 30, collected: false, bob: Math.random() * 100 });
    }

    // ===== سکه‌های زمینی: کاملاً خوشه‌ای (ردیف، ستون، قوس، شبکه، تکی) =====
    {
        const dense = !!cfg.noHazards;
        let x = 220;
        const step = dense ? [70, 120] : [190, 330];
        while (x < LEVEL_LENGTH - 160) {
            const r = Math.random();
            let placedAny = false;
            const freeHere = (xx) => !isInPit(xx, currentPits)
                && !pipes.some(p => Math.abs(p.x - xx) < 34)
                && !blocks.some(b => Math.abs(b.x - xx) < 26)
                && !platforms.some(p => Math.abs(p.x - xx) < p.w / 2 + 12 && p.y > baseGroundHeightAt(xx) - 130)
                && !stars.some(s => Math.abs(s.x - xx) < 70)
                && !arrowPickups.some(a => a.py === undefined && Math.abs(a.x - xx) < 32)
                && !(caveAt(xx) && inHole(caveAt(xx), xx));
            if (r < 0.26) {
                // ردیف افقی نزدیکِ زمین
                const n = 3 + Math.floor(Math.random() * 4), h = 22 + Math.random() * 18;
                for (let i = 0; i < n; i++) { const ax = x + i * 26; if (freeHere(ax)) { coins.push({ x: ax, heightOffset: h, collected: false }); placedAny = true; } }
                x += n * 26;
            } else if (r < 0.46) {
                // ستون عمودی (باید بپری)
                const n = 3 + Math.floor(Math.random() * 3);
                for (let i = 0; i < n; i++) { if (freeHere(x)) { coins.push({ x, heightOffset: 26 + i * 30, collected: false }); placedAny = true; } }
                x += 34;
            } else if (r < 0.68) {
                // قوس پرش
                const n = 5 + Math.floor(Math.random() * 2);
                for (let i = 0; i < n; i++) { const ax = x + i * 27; if (freeHere(ax)) { coins.push({ x: ax, heightOffset: 30 + Math.sin(i / (n - 1) * Math.PI) * 74, collected: false }); placedAny = true; } }
                x += n * 27;
            } else if (r < 0.86) {
                // شبکه‌ی ۳×۲
                for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) { const ax = x + i * 25; if (freeHere(ax)) { coins.push({ x: ax, heightOffset: 26 + j * 32, collected: false }); placedAny = true; } }
                x += 3 * 25;
            } else {
                // جفت تکی
                if (freeHere(x)) { coins.push({ x, heightOffset: 20 + Math.random() * 30, collected: false }); placedAny = true; }
                if (freeHere(x + 24)) coins.push({ x: x + 24, heightOffset: 20 + Math.random() * 30, collected: false });
                x += 24;
            }
            x += step[0] + Math.random() * (step[1] - step[0]) * (placedAny ? 1 : 0.4);
        }
    }
    // مرتب‌سازی برای رندر پنجره‌ای (کارایی)
    Math.random = oldRand; // برگرداندن به حالت عادی برای ذرات و انیمیشن‌ها
    const byX = (a, b) => a.x - b.x;
    coins.sort(byX); grassTufts.sort(byX); treesAndBushes.sort(byX); fruits.sort(byX);
}

// ===================== LOSE LIFE =====================
function clearNearbyHazards() {
    const R = 340;
    // همه‌ی دشمن‌های نزدیک (از جمله کاکتوس و درخت‌های غول) از بین می‌روند
    enemies.forEach(en => { if (en.alive && Math.abs(en.x - player.worldX) < R) { en.alive = false; en.dying = true; en.deathTimer = 0; } });
    // لوله‌های نزدیک بسته می‌شوند
    pipes.forEach(p => { if (!p.dead && Math.abs(p.x - player.worldX) < R) { p.phase = "closed"; p.timer = 0; } });
    // گلوله‌های هوایی پاک می‌شوند
    bossProjectiles = bossProjectiles.filter(b => Math.abs(b.x - player.worldX) > R);
    // قندیل‌های در حال سقوط نزدیک، بی‌خطر می‌شوند
    icicles.forEach(ic => { if (Math.abs(ic.x - player.worldX) < R) { ic.fell = "done"; } });
    // غول از بازیکن دور می‌شود تا فرصت نفس کشیدن بدهد
    if (boss && boss.alive) { boss.x = player.worldX - 300; boss.paused = false; boss.cycleTimer = 0; }
    // پاک کردن چاله‌ای که توش افتادیم
    const idx = currentPits.findIndex(p => player.worldX >= p.start - 10 && player.worldX <= p.end + 10);
    if (idx >= 0) currentPits.splice(idx, 1);
}

function loseLife() {
    if (deadFlag || invulnFrames > 0) return;
    deadFlag = true;
    lives--;
    if (lives > 0) {
        player.pitFalling = false; player.isJumping = false; player.velocityY = 0;
        let safeX2 = player.worldX - 150;
        while (isInPit(safeX2, currentPits) && safeX2 > 0) safeX2 -= 30;
        player.worldX = Math.max(10, safeX2);
        player.y = baseGroundHeightAt(player.worldX) - player.height;
        player.onSurface = null;
        invulnFrames = 100; deadFlag = false;
        levelTimeLeft = Math.max(levelTimeLeft, 1800); // حداقل ۳۰ ثانیه فرصت
        clearNearbyHazards();
    } else { gameState = "lose"; }
}

// ===================== ARROWS =====================
function fireArrow() {
    if (arrowsInLevel <= 0) return;
    arrowsInLevel--; persistentArrows = arrowsInLevel;
    arrows.push({ x: player.worldX + player.facing * 18, y: player.y + 22, dir: player.facing });
}
function updateArrows() {
    arrows.forEach(a => {
        a.x += a.dir * 13;
        enemies.forEach(en => {
            if (!en.alive || en.kind === "cactus") return;
            const egy = en.cave ? en.cave.floorY : baseGroundHeightAt(en.x);
            if (Math.abs(a.x - en.x) < 18 && Math.abs(a.y - (egy - 16)) < 28) {
                en.alive = false; en.dying = true; en.deathTimer = 0; a.hit = true;
                const dc = (en.kind === "snowman" || en.kind === "wolf") ? ["#FFFFFF", "#B3E5FC", "#E1F5FE"] : en.kind.includes("fire") || en.kind.includes("lava") ? ["#FF5722", "#FFC107", "#fff"] : ["#8D6E63", "#6D4C41", "#D7CCC8"];
                burst(en.x, egy - 16, { n: 12, colors: dc, spd: 2.8, size: 2.8 });
            }
        });
        pipes.forEach(p => { if (p.dead || p.phase !== "open") return; if (Math.abs(a.x - p.x) < 20 && Math.abs(a.y - (baseGroundHeightAt(p.x) - 110)) < 30) { p.dead = true; a.hit = true; burst(p.x, baseGroundHeightAt(p.x) - 110, { n: 12, colors: ["#558B2F", "#8BC34A", "#fff"], spd: 3, size: 2.8 }); } });
        if (boss && boss.alive && Math.abs(a.x - boss.x) < 48 && a.y > baseGroundHeightAt(boss.x) - 150) {
            if (boss.reviveT > 0) { a.hit = true; return; }
            boss.health--; a.hit = true; boss.hitFlash = 6;
            burst(a.x, a.y, { n: 8, colors: ["#FF5722", "#FFC107", "#fff"], spd: 3, size: 2.6 });
            if (boss.health <= 0) {
                const gyb = baseGroundHeightAt(boss.x);
                if (boss.phase < boss.phases) {
                    // ===== مرحله‌ی بعدی غول: زنده می‌شود و خشمگین‌تر می‌گردد =====
                    boss.phase++;
                    boss.reviveT = 110;
                    boss.maxHealth = Math.round(boss.maxHealth * 1.18);
                    boss.health = boss.maxHealth;
                    boss.rage = (boss.phase - 1) * 0.22;
                    totalCoins += 25;
                    burst(boss.x, gyb - 70, { n: 34, colors: ["#FF5722", "#FFC107", "#fff"], spd: 4.6, size: 3.4, shape: "rect", life: 46 });
                    floatTexts.push({ x: boss.x, y: gyb - 150, txt: (lang === "fa" ? "مرحله " : "PHASE ") + boss.phase + "!", color: "#FF5252", life: 0 });
                    saveGame();
                } else {
                    boss.alive = false; totalCoins += 50;
                    burst(boss.x, gyb - 60, { n: 45, colors: ["#FF5722", "#FFC107", "#FFEE58", "#fff"], spd: 5.5, size: 4, shape: "rect", life: 55 });
                    burst(boss.x, gyb - 60, { n: 20, colors: ["#FFEB3B", "#fff"], spd: 7, size: 2.5, life: 40 });
                    floatTexts.push({ x: boss.x, y: gyb - 130, txt: "+50", color: "#FFD700", life: 0 });
                    triggerBossWin();
                }
            }
        }
    });
    arrows = arrows.filter(a => !a.hit && Math.abs(a.x - player.worldX) < 700);
}

// ===================== ENEMIES =====================
function updateEnemies() {
    const cfg = activeLevels()[currentLevel];
    const chR = (cfg.chaseRange || 160) * 1.12, chS = (cfg.chaseSpeed || 0.9) * 1.08, wS = 0.34;
    const actR = canvas.width * 0.75 + 260;
    enemies.forEach(en => {
        if (!en.alive) { if (en.dying) en.deathTimer++; return; }
        if (Math.abs(en.x - player.worldX) > actR) return;   // دشمن‌های دور پردازش نمی‌شوند
        if (en.kind === "bossTree") {
            const d = player.worldX - en.x;
            en.x += d > 0 ? player.speed : d < 0 ? -player.speed : 0;
            en.facing = d > 0 ? 1 : -1;
        } else if (en.kind === "hunter") {
            const d = player.worldX - en.x; en.shootTimer--;
            const onScreen = Math.abs(en.x - player.worldX) < canvas.width / 2 + 80;
            if (onScreen && en.shootTimer <= 0) { en.shootTimer = 200; bossProjectiles.push({ x: en.x, y: baseGroundHeightAt(en.x) - 30, dir: d > 0 ? 1 : -1 }); }
            en.facing = d > 0 ? 1 : -1;
        } else if (en.kind === "snowman") {
            // آدم‌برفی: آرام نزدیک می‌شود و گلوله‌ی برفی پرتاب می‌کند
            const d = player.worldX - en.x, aD = Math.abs(d);
            en.shootTimer = (en.shootTimer || 90) - 1;
            if (aD < chR * 1.35) { en.x += (d > 0 ? 1 : -1) * chS * 0.62; }
            else { en.wanderTimer--; if (en.wanderTimer <= 0) { en.wanderDir = Math.random() < 0.5 ? -1 : 1; en.wanderTimer = 80 + Math.random() * 110; } en.x += en.wanderDir * wS * 0.8; }
            if (aD < canvas.width / 2 && en.shootTimer <= 0) { en.shootTimer = 190 + Math.random() * 60; bossProjectiles.push({ x: en.x, y: baseGroundHeightAt(en.x) - 34, dir: d > 0 ? 1 : -1, snow: true }); }
            en.facing = d > 0 ? 1 : -1;
        } else if (en.kind === "fireslime") {
            const d = player.worldX - en.x, aD = Math.abs(d);
            en.hopT = (en.hopT || 0) + 1; const cyc = en.hopT % 60;
            en.hopH = cyc < 28 ? Math.sin((cyc / 28) * Math.PI) * 45 : 0;
            if (cyc < 28) en.x += (aD < chR * 1.5 ? (d > 0 ? 1 : -1) : en.wanderDir) * chS * 1.1;
            else if (cyc === 28) en.wanderDir = Math.random() < 0.5 ? -1 : 1;
            en.facing = (aD < chR * 1.5 ? (d > 0 ? 1 : -1) : en.wanderDir);
        } else if (en.kind === "lavaworm") {
            const d = player.worldX - en.x, aD = Math.abs(d);
            en.shootTimer = (en.shootTimer || 120) - 1;
            if (aD < chR * 1.2) en.x += (d > 0 ? 1 : -1) * chS * 0.7;
            else { en.wanderTimer--; if (en.wanderTimer <= 0) { en.wanderDir = Math.random() < 0.5 ? -1 : 1; en.wanderTimer = 90 + Math.random() * 90; } en.x += en.wanderDir * wS * 0.6; }
            if (aD < canvas.width / 2 && en.shootTimer <= 0) { en.shootTimer = 160 + Math.random() * 40; bossProjectiles.push({ x: en.x, y: baseGroundHeightAt(en.x) - 10, dir: d > 0 ? 1 : -1, fire: true, vy: -4 }); }
            en.facing = d > 0 ? 1 : -1;
        } else if (en.kind === "marsbat") {
            const d = player.worldX - en.x, aD = Math.abs(d);
            en.hoverPhase = (en.hoverPhase || 0) + 0.1;
            en.x += clamp(d * 0.015, -1.8, 1.8);
            en.facing = d > 0 ? 1 : -1;
            if (Math.abs(player.worldX - en.x) < 26 && Math.abs(player.y - (baseGroundHeightAt(en.x) - 110 + Math.sin(en.hoverPhase) * 15)) < 26) {
                if (player.hasShield) { player.hasShield = false; invulnFrames = 30; } else loseLife();
            }
            return; // no ground collision
        } else if (en.kind === "slime") {
            // ژله‌ی فضایی: جهش‌های قوسی
            const d = player.worldX - en.x, aD = Math.abs(d);
            en.hopT = (en.hopT || 0) + 1;
            const cyc = en.hopT % 78;
            en.hopH = cyc < 34 ? Math.sin((cyc / 34) * Math.PI) * 34 : 0;
            if (cyc < 34) en.x += (aD < chR * 1.4 ? (d > 0 ? 1 : -1) : en.wanderDir) * chS * 0.85;
            else if (cyc === 34) { en.wanderDir = Math.random() < 0.5 ? -1 : 1; }
            en.facing = (aD < chR * 1.4 ? (d > 0 ? 1 : -1) : en.wanderDir);
        } else if (en.kind === "alien") {
            // بیگانه: تعقیب + شلیک لیزر
            const d = player.worldX - en.x, aD = Math.abs(d);
            en.shootTimer--;
            if (aD < chR * 1.3) en.x += (d > 0 ? 1 : -1) * chS * 0.9;
            else { en.wanderTimer--; if (en.wanderTimer <= 0) { en.wanderDir = Math.random() < 0.5 ? -1 : 1; en.wanderTimer = 70 + Math.random() * 100; } en.x += en.wanderDir * wS; }
            if (aD < canvas.width / 2 && en.shootTimer <= 0) { en.shootTimer = 175 + Math.random() * 70; bossProjectiles.push({ x: en.x, y: baseGroundHeightAt(en.x) - 34, dir: d > 0 ? 1 : -1, laser: true }); }
            en.facing = d > 0 ? 1 : -1;
        } else if (en.kind === "ufo") {
            // بشقاب‌پرنده: شناور، پرتو می‌اندازد
            const d = player.worldX - en.x;
            en.x += clamp(d * 0.011, -1.7, 1.7);
            en.hoverPhase += 0.04;
            en.shootTimer--;
            if (Math.abs(d) < 190 && en.shootTimer <= 0) {
                en.shootTimer = 150 + Math.random() * 70;
                en.beam = 34;
            }
            if (en.beam > 0) {
                en.beam--;
                const gy2 = baseGroundHeightAt(en.x);
                if (invulnFrames <= 0 && Math.abs(player.worldX - en.x) < 22 && player.y + player.height > gy2 - 120) {
                    if (player.hasShield) { player.hasShield = false; invulnFrames = 34; } else loseLife();
                }
            }
            en.facing = d > 0 ? 1 : -1;
        } else if (en.kind === "wolf") {
            // گرگ برفی: سریع، جهشی
            const d = player.worldX - en.x, aD = Math.abs(d);
            en.lunge = (en.lunge || 0) - 1;
            if (aD < chR * 1.5) {
                if (en.lunge <= 0 && aD < 190) { en.lunge = 95; }
                const sp = en.lunge > 60 ? chS * 2.45 : chS * 1.25;
                en.x += (d > 0 ? 1 : -1) * sp;
            } else { en.wanderTimer--; if (en.wanderTimer <= 0) { en.wanderDir = Math.random() < 0.5 ? -1 : 1; en.wanderTimer = 60 + Math.random() * 90; } en.x += en.wanderDir * wS * 1.5; }
            en.facing = d > 0 ? 1 : -1;
        } else if (en.kind !== "cactus") {
            const d = player.worldX - en.x, aD = Math.abs(d); let mv;
            // فقط وقتی بازیکن هم‌سطح است متوجه می‌شوند (نه وقتی روی سکو/غار است)
            const sameLevel = !player.inCave && !en.cave
                ? Math.abs((player.y + player.height) - baseGroundHeightAt(player.worldX)) < 55
                : (!!player.inCave === !!en.cave);
            if (aD < chR && sameLevel) { mv = d > 0 ? 1 : -1; en.x += mv * chS * (en.kind === "hedgehog" ? 0.95 : 1); }
            else { en.wanderTimer--; if (en.wanderTimer <= 0) { en.wanderDir = Math.random() < 0.5 ? -1 : 1; en.wanderTimer = 70 + Math.random() * 120; } mv = en.wanderDir; en.x += mv * wS; }
            if (mv !== 0) en.facing = mv > 0 ? 1 : -1;
        }
        // دشمنان غار داخل غار می‌مانند
        if (en.cave) { en.x = clamp(en.x, en.cave.x1 + 20, en.cave.x2 - 20); }
        if (en.kind !== "cactus" && en.kind !== "ufo" && !en.cave && isInPit(en.x, currentPits)) { en.alive = false; en.dying = true; en.deathTimer = 0; return; }
        if (invulnFrames > 0) return;
        if (!!en.cave !== !!player.inCave) return;
        const pL = player.worldX - player.width / 2, pR = player.worldX + player.width / 2, pT = player.y, pB = player.y + player.height;
        const gy = (en.cave ? en.cave.floorY : baseGroundHeightAt(en.x)) - (en.hopH || 0);
        const eW = en.kind === "bossTree" ? 20 : en.kind === "wolf" ? 40 : en.kind === "slime" ? 30 : 34;
        const eH = en.kind === "hedgehog" ? 26 : en.kind === "cactus" ? 40 : en.kind === "bossTree" ? 60 : en.kind === "snowman" ? 44 : en.kind === "wolf" ? 30 : en.kind === "alien" ? 44 : en.kind === "slime" || en.kind === "fireslime" ? 26 : en.kind === "lavaworm" ? 30 : 24;
        if (en.kind === "ufo" || en.kind === "marsbat") {   // برخورد هوایی جدا
            const uy = baseGroundHeightAt(en.x) - (en.hoverY + Math.sin(en.hoverPhase) * 10);
            if (Math.abs(player.worldX - en.x) < 26 && Math.abs((player.y + 18) - uy) < 22) {
                if (player.velocityY > 0 && player.y + player.height < uy + 22) { en.alive = false; en.dying = true; en.deathTimer = 0; player.velocityY = player.jumpPower * 0.6; burst(en.x, uy, { n: 12, colors: ["#69F0AE", "#B2FF59", "#fff"], spd: 3, size: 3 }); }
                else if (player.hasShield) { player.hasShield = false; invulnFrames = 30; }
                else loseLife();
            }
            return;
        }
        if (pR > en.x - eW / 2 && pL < en.x + eW / 2 && pB > gy - eH && pT < gy) {
            if (en.kind === "snail" || en.kind === "snowman" || en.kind === "slime" || en.kind === "fireslime") {
                const wasAbove = (pB - player.velocityY) <= gy - eH + 8;
                if (player.velocityY > 0 && wasAbove) { en.alive = false; en.dying = true; en.deathTimer = 0; player.velocityY = player.jumpPower * 0.6; player.isJumping = true; burst(en.x, gy - 12, { n: 10, colors: ["#8D6E63", "#D84315", "#D7CCC8"], spd: 2.8, size: 2.8 }); }
                else if (player.hasShield) { player.hasShield = false; player.worldX += (player.worldX > en.x ? 1 : -1) * 30; invulnFrames = 30; }
                else loseLife();
            } else {
                if (player.hasShield) { player.hasShield = false; player.worldX += (player.worldX > en.x ? 1 : -1) * 30; invulnFrames = 30; }
                else loseLife();
            }
        }
    });
}

// ===================== قندیل‌های یخی =====================
function updateIcicles() {
    icicles.forEach(ic => {
        if (ic.fell === "done" || Math.abs(ic.x - player.worldX) > 700) return;
        if (!ic.fell) {
            if (Math.abs(player.worldX - ic.x) < 46) { ic.shake++; if (ic.shake > 26) { ic.fell = true; ic.vy = 0; } }
            else if (ic.shake > 0) ic.shake = Math.max(0, ic.shake - 1);
            return;
        }
        ic.vy += 0.42; ic.y += ic.vy;
        const gy = baseGroundHeightAt(ic.x);
        if (ic.y + ic.len >= gy) { ic.fell = "done"; burst(ic.x, gy - 6, { n: 14, colors: ["#B3E5FC", "#E1F5FE", "#fff"], spd: 3.2, size: 2.8, shape: "rect" }); return; }
        if (invulnFrames <= 0 && Math.abs(ic.x - player.worldX) < 16 && (player.y + player.height) > ic.y && player.y < ic.y + ic.len) {
            if (player.hasShield) { player.hasShield = false; invulnFrames = 30; ic.fell = "done"; }
            else loseLife();
        }
    });
}
// ===================== PIPES =====================
function updatePipes() {
    pipes.forEach(p => {
        if (p.dead || Math.abs(p.x - player.worldX) > 700) return;
        p.timer++; if (p.phase === "closed" && p.timer > 120) { p.phase = "open"; p.timer = 0; }
        else if (p.phase === "open" && p.timer > 150) { p.phase = "closed"; p.timer = 0; }
        if (p.phase === "open" && invulnFrames <= 0) {
            const gy = baseGroundHeightAt(p.x), hT = gy - 140, hB = gy - 80;
            if (Math.abs(player.worldX - p.x) < 22 && (player.y + player.height) > hT && player.y < hB) {
                if (player.hasShield) { player.hasShield = false; player.worldX += (player.worldX > p.x ? 1 : -1) * 35; invulnFrames = 30; } else loseLife();
            }
        }
    });
}

// ===================== BLOCKS =====================
function getBlockDrop(isExtra) {
    if (!isExtra) { const r = Math.random(); if (r < 0.45) return "coin"; if (r < 0.72) return "shield"; return "clock"; }
    const r = Math.random();
    if (r < 0.26) return "shield";
    if (r < 0.44) return "shoe";
    if (r < 0.58) return "thunder";
    if (r < 0.74) return "coin";
    if (r < 0.86) return "goldcoin";
    return "clock";
}
function updateBlocksAndItems() {
    blocks.forEach(b => {
        if (b.hit) { if (b.fadeTimer < 30) b.fadeTimer++; return; }
        if (Math.abs(b.x - player.worldX) > 120) return;
        const gy = baseGroundHeightAt(b.x);
        const blockTop = gy - BLOCK_HEIGHT - 13;
        const blockBottom = gy - BLOCK_HEIGHT + 13;
        const xNear = Math.abs(player.worldX - b.x) < 22;
        if (xNear && player.velocityY < 0 && player.y <= blockBottom && player.y > blockBottom - 16) {
            b.hit = true; b.fadeTimer = 0; player.velocityY = 2;
            droppedItems.push({ x: b.x, y: gy - BLOCK_HEIGHT, vy: 0, type: getBlockDrop(b.extra), landed: false, collected: false });
            burst(b.x, gy - BLOCK_HEIGHT, { n: 8, colors: b.extra ? ["#F48FB1", "#E91E63", "#fff"] : ["#FFD54F", "#D9A441", "#fff"], spd: 2.6, size: 2.6, shape: "rect" });
        }
    });
    droppedItems.forEach(item => {
        if (item.collected) return;
        if (!item.landed) { const gy = baseGroundHeightAt(item.x); item.vy += 0.4; item.y += item.vy; if (item.y >= gy - 14) { item.y = gy - 14; item.landed = true; item.vy = 0; } }
        if (Math.abs(player.worldX - item.x) < 20 && Math.abs((player.y + player.height / 2) - item.y) < 26) {
            item.collected = true;
            if (item.type === "coin") totalCoins++;
            else if (item.type === "goldcoin") { totalCoins += 100; floatTexts.push({ x: item.x, y: item.y - 10, txt: "+100", color: "#FFD700", life: 0 }); burst(item.x, item.y, { n: 16, colors: ["#FFD700", "#FF8C00", "#fff"], spd: 3.2, size: 3, shape: "rect" }); }
            else if (item.type === "shield") { player.hasShield = true; burst(item.x, item.y, { n: 10, colors: ["#2196F3", "#64B5F6", "#fff"], spd: 2.4, size: 2.6 }); }
            else if (item.type === "shoe") { shoeActive = 1200; burst(item.x, item.y, { n: 10, colors: ["#795548", "#A1887F"], spd: 2.4, size: 2.6 }); }
            else if (item.type === "thunder") { thunderActive = 1200; burst(item.x, item.y, { n: 12, colors: ["#FFEB3B", "#fff"], spd: 3, size: 2.6, shape: "rect" }); }
            else if (item.type === "clock") { levelTimeLeft += 100 * 60; floatTexts.push({ x: item.x, y: item.y - 10, txt: "+100s", color: "#4DD0E1", life: 0 }); burst(item.x, item.y, { n: 12, colors: ["#4DD0E1", "#B2EBF2", "#fff"], spd: 2.8, size: 2.8, shape: "rect" }); }
            saveGame();
        }
    });
    // پیر شدن متن‌های شناور
    floatTexts = floatTexts.filter(ft => ft.life < 55);
    eachInView(fruits, player.worldX - 30, player.worldX + 30, fr => {
        if (fr.collected) return;
        if (Math.abs(player.worldX - fr.x) < 18 && Math.abs((player.y + player.height / 2) - fr.y) < 22) { fr.collected = true; totalCoins += 3; burst(fr.x, fr.y, { n: 6, colors: ["#E53935", "#66BB6A"], spd: 2, size: 2.6 }); saveGame(); }
    });
}

// ===================== BOSS =====================
function updateBoss() {
    if (!boss || !boss.alive) return;
    const cfg = activeLevels()[currentLevel];
    if (boss.hitFlash > 0) boss.hitFlash--;
    // زنده‌شدن بین مرحله‌ها: چند لحظه بی‌حرکت و آسیب‌ناپذیر
    if (boss.reviveT > 0) {
        boss.reviveT--;
        if (boss.reviveT % 6 === 0) burst(boss.x + (Math.random() - 0.5) * 50, baseGroundHeightAt(boss.x) - 30 - Math.random() * 90, { n: 3, colors: ["#FF5252", "#FFCA28"], spd: 2.4, size: 2.6 });
        if (invulnFrames <= 0 && Math.abs(player.worldX - boss.x) < 55) loseLife();
        return;
    }
    // چرخه‌ی مکث
    if (cfg.bossPauseInterval) { boss.cycleTimer++; if (!boss.paused && boss.cycleTimer > cfg.bossPauseInterval) { boss.paused = true; boss.cycleTimer = 0; } else if (boss.paused && boss.cycleTimer > cfg.bossPauseDuration) { boss.paused = false; boss.cycleTimer = 0; } }
    // غول مستقیم می‌آید جلو تا به بازیکن برسد و بخوردش
    if (!boss.paused) {
        const d = player.worldX - boss.x;
        if (Math.abs(d) > 4) boss.x += Math.sign(d) * cfg.bossChaseSpeed * (1 + boss.rage);
    }
    boss.facing = player.worldX >= boss.x ? 1 : -1;
    // تیر غول آهنی
    if (cfg.bossShootInterval && !boss.paused) { boss.shootTimer++; if (boss.shootTimer >= cfg.bossShootInterval * (1 - boss.rage * 0.7)) { boss.shootTimer = 0; bossProjectiles.push({ x: boss.x, y: baseGroundHeightAt(boss.x) - 45, dir: 1 }); } }
    // غول درخت: ساخت درخت دشمن
    if (cfg.bossType === "treeKing") {
        boss.spawnTimer = (boss.spawnTimer || 0) + 1;
        if (boss.spawnTimer >= 180) { boss.spawnTimer = 0; enemies.push({ kind: "bossTree", x: boss.x + 80, alive: true, dying: false, deathTimer: 0, facing: 1 }); }
    }
    // تیتان گدازه: سنگ از بالا پرت می‌کند
    if (cfg.bossType === "lavaTitan" && !boss.paused) {
        boss.rockTimer = (boss.rockTimer || 0) + 1;
        if (boss.rockTimer >= 110) {
            boss.rockTimer = 0;
            // ۳ سنگ از بالا در موقعیت‌های تصادفی نزدیک بازیکن
            for (let k = 0; k < 3; k++) {
                const rx = player.worldX + (Math.random() - 0.5) * 320;
                bossProjectiles.push({ x: rx, y: -40, dir: 0, fire: true, vy: 0, rock: true });
            }
        }
    }
    // شاه یخ: موج سه‌تایی گلوله‌ی برفی + احضار گرگ
    if (cfg.bossType === "frostKing") {
        boss.spawnTimer = (boss.spawnTimer || 0) + 1;
        if (boss.spawnTimer >= 300) {
            boss.spawnTimer = 0;
            enemies.push({ kind: "wolf", x: boss.x + 60, alive: true, dying: false, deathTimer: 0, facing: 1, wanderDir: 1, wanderTimer: 60, lunge: 0 });
        }
        boss.waveTimer = (boss.waveTimer || 0) + 1;
        if (boss.waveTimer >= 220 && !boss.paused) {
            boss.waveTimer = 0;
            const gyb = baseGroundHeightAt(boss.x);
            for (let k = 0; k < 3; k++) bossProjectiles.push({ x: boss.x + 20, y: gyb - 40 - k * 26, dir: 1, snow: true });
            burst(boss.x + 20, gyb - 66, { n: 12, colors: ["#B3E5FC", "#fff"], spd: 3, size: 3 });
        }
    }
    // تماس با غول = مرگ (یا مصرف سپر)
    if (invulnFrames <= 0 && Math.abs(player.worldX - boss.x) < 50) {
        const gy = baseGroundHeightAt(boss.x);
        if (player.y + player.height > gy - 115) {
            if (player.hasShield) {
                player.hasShield = false;
                player.worldX += (player.worldX > boss.x ? 1 : -1) * 70;
                player.velocityY = -9; player.isJumping = true;
                invulnFrames = 60;
            } else loseLife();
        }
    }
}
function updateBossProjectiles() {
    bossProjectiles.forEach(bp => { bp.x += bp.dir * 6; if (invulnFrames <= 0 && Math.abs(bp.x - player.worldX) < 18 && Math.abs(bp.y - (player.y + player.height / 2)) < 20) { loseLife(); bp.hit = true; } });
    bossProjectiles = bossProjectiles.filter(bp => !bp.hit && (Math.abs(bp.x - player.worldX) < 900 || bp.fire));
}
function updateArrowPickups() {
    arrowPickups.forEach(a => {
        if (a.collected || Math.abs(a.x - player.worldX) > 60) return;
        if ((a.cave && !player.inCave) || (!a.cave && player.inCave)) return;
        const ay = a.py !== undefined ? a.py : baseGroundHeightAt(a.x) - 20;
        if (Math.abs(player.worldX - a.x) < 20 && Math.abs((player.y + player.height / 2) - ay) < 24) {
            a.collected = true; arrowsInLevel++; persistentArrows = arrowsInLevel; saveGame();
            const cfg = activeLevels()[currentLevel];
            if (cfg.hasTutorial && tutorialState === null) { tutorialState = "showing"; tutorialTimer = 0; gameState = "tutorial"; }
        }
    });
}

// ===================== PHYSICS =====================
function updatePlayerPhysics() {
    const cfgP = activeLevels()[currentLevel];
    player.gravity = cfgP.lowGrav ? 0.30 : 0.55;   // جاذبه‌ی کم ماه
    const speed = thunderActive > 0 ? player.speed * 3 : player.speed;
    // یخ زمستان: حرکت لغزنده با اینرسی
    if (cfgP.icy) {
        const target = (keys.right ? speed : 0) - (keys.left ? speed : 0);
        player.slide = (player.slide || 0) + (target - (player.slide || 0)) * (player.isJumping ? 0.05 : 0.085);
        if (Math.abs(player.slide) < 0.04) player.slide = 0;
        player.worldX += player.slide;
        if (player.slide > 0.4) player.facing = 1; else if (player.slide < -0.4) player.facing = -1;
        if (!player.isJumping && Math.abs(player.slide) > 1.4 && frameCount % 7 === 0) dust(player.worldX, player.y + player.height, 1, Math.sign(player.slide));
    } else {
        player.slide = 0;
        if (keys.left) { player.worldX -= speed; player.facing = -1; }
        if (keys.right) { player.worldX += speed; player.facing = 1; }
    }
    player.worldX = Math.max(0, player.worldX);

    const cv = player.inCave;
    // دیواره‌های غار
    if (cv) player.worldX = clamp(player.worldX, cv.x1 + 14, cv.x2 - 14);

    const rawG = baseGroundHeightAt(player.worldX);
    const overCave = caveAt(player.worldX);
    // سوراخ ورودی/خروجی غار: زمین ندارد
    const overHole = !cv && overCave && inHole(overCave, player.worldX);
    const overPit = !cv && isInPit(player.worldX, currentPits);
    const gL = cv ? cv.floorY : rawG;

    if (player.pitFalling) {
        player.velocityY += player.gravity; player.y += player.velocityY;
        if (player.y - camY > canvas.height + 50) loseLife();
        return;
    }

    // سطوح قابل‌ایستادن (فقط آن‌هایی که با وضعیت غار/سطح هم‌خوانی دارند)
    const surfaces = [];
    for (let i = 0; i < platforms.length; i++) { const p = platforms[i]; if (!!p.cave === !!cv) surfaces.push(p); }
    if (!cv) for (let i = 0; i < blocks.length; i++) { const b = blocks[i]; if (!b.hit) surfaces.push({ x: b.x, w: 30, y: baseGroundHeightAt(b.x) - BLOCK_HEIGHT - 13, blk: b }); }

    if (!player.isJumping) {
        if (player.onSurface) {
            const s2 = player.onSurface;
            if ((s2.blk && s2.blk.hit) || Math.abs(player.worldX - s2.x) > s2.w / 2 + 8) {
                player.onSurface = null; player.isJumping = true; player.velocityY = 0;
            } else { player.y = s2.y - player.height; return; }
        }
        if (!player.isJumping) {
            if (overPit || overHole) { player.isJumping = true; player.velocityY = 0; player.onSurface = null; }
            else { player.y = gL - player.height; player.onSurface = null; return; }
        }
    }
    // حالت هوایی
    player.velocityY += player.gravity; player.y += player.velocityY;
    const feet = player.y + player.height, prevFeet = feet - player.velocityY;

    // برخورد با سقف غار (فقط وقتی دقیقاً زیر سوراخ نیستیم)
    if (cv && player.velocityY < 0 && !inHole(cv, player.worldX) && player.y < cv.floorY - 192) {
        player.y = cv.floorY - 192; player.velocityY = 1.2;
        dust(player.worldX, player.y, 3, 0);
    }
    // ورود به غار از سوراخ
    if (!cv && overHole && feet > rawG + 6) { player.inCave = overCave; overCave.found = true; burst(player.worldX, rawG, { n: 12, colors: ["#6D4C41", "#8D6E63", "#A1887F"], spd: 2.6, size: 2.8 }); }
    // خروج از غار: از سوراخ بپر بیرون
    if (cv && inHole(cv, player.worldX) && player.y + player.height < baseGroundHeightAt(player.worldX) - 4 && player.velocityY < 0) { player.inCave = null; }

    if (player.velocityY > 0) {
        for (let i = 0; i < surfaces.length; i++) {
            const s2 = surfaces[i];
            if (Math.abs(player.worldX - s2.x) > s2.w / 2 + 7) continue;
            if (prevFeet <= s2.y + 2 && feet >= s2.y) {
                player.y = s2.y - player.height; player.velocityY = 0; player.isJumping = false; player.onSurface = s2;
                dust(player.worldX, s2.y, 4, 0); landSquash = 9;
                return;
            }
        }
    }
    const curG = player.inCave ? player.inCave.floorY : rawG;
    if (feet >= curG) {
        if (!player.inCave && (overPit || (overCave && inHole(overCave, player.worldX)))) { if (overPit) player.pitFalling = true; }
        else { player.y = curG - player.height; player.velocityY = 0; player.isJumping = false; player.onSurface = null; dust(player.worldX, curG, 4, 0); landSquash = 9; }
    }
}
function playerSlope() { return player.inCave || player.onSurface ? 0 : slopeAt(player.worldX); }

// ===== دوربین عمودی: وقتی زیاد بالا/پایین می‌رویم صفحه دنبال می‌کند =====
function updateCamera() {
    // قفل کردن دوربین روی کاراکتر (بازیکن همیشه در 60% پایین صفحه دیده شود)
    const pCenter = player.y + player.height / 2;
    let target = pCenter - canvas.height * 0.6;
    
    // بیرون از غار، نگذاریم دوربین خیلی پایین برود تا زیر زمین دیده نشود
    if (!player.inCave) {
        const maxDown = baseGroundHeightAt(player.worldX) - canvas.height + 40;
        target = Math.min(target, maxDown);
    }
    
    camY += (target - camY) * 0.15;
}

// ===================== WIN =====================
function triggerWin() {
    activeStars()[currentLevel] = Math.max(activeStars()[currentLevel] || 0, starsCollectedThisRun);
    const n = currentLevel + 1;
    if (activeLevels()[n]) activeUnlocked()[n] = true;
    if (currentLevel === 25) {
        activeUnlocked().done25 = true;
        if (currentSeason === 1) levelUnlocked2[1] = true;
        else if (currentSeason === 2) levelUnlocked3[1] = true;
        else if (currentSeason === 3) levelUnlocked4[1] = true;
        else if (currentSeason === 4) levelUnlocked5[1] = true;
        else if (currentSeason === 5) { levelUnlocked6[1] = true; }
    }
    if (currentSeason === 2 && currentLevel === 10) livesUpgradeUnlocked = true;
    winAnimStartFrame = globalFrame; saveGame();
}
function triggerBossWin() {
    triggerWin();
    if (currentSeason === 4 && currentLevel === 25) { cutT = 0; cutType = "crash"; gameState = "cutscene"; return; }
    if (currentSeason === 5 && currentLevel === 25) { cutT = 0; cutType = "venus"; gameState = "cutscene"; return; }
    gameState = "win";
}

function drawTree(x, bY, season) {
    if (season === "winter") {
        // کاج برفی
        ctx.fillStyle = "#5D4037"; ctx.fillRect(x - 5, bY - 34, 10, 34);
        const tiers = [[0, -30, 26], [0, -52, 21], [0, -72, 15]];
        tiers.forEach(([ox, oy, w2], i) => {
            ctx.fillStyle = i === 2 ? "#1B5E20" : i === 1 ? "#175E17" : "#14521A";
            ctx.beginPath(); ctx.moveTo(x + ox, bY + oy - 26); ctx.lineTo(x + ox - w2, bY + oy); ctx.lineTo(x + ox + w2, bY + oy); ctx.closePath(); ctx.fill();
            // برف روی شاخه
            ctx.fillStyle = "#FFFFFF";
            ctx.beginPath(); ctx.moveTo(x + ox, bY + oy - 26); ctx.lineTo(x + ox - w2 * 0.62, bY + oy - 8); ctx.lineTo(x + ox - w2 * 0.3, bY + oy - 9); ctx.lineTo(x + ox - w2 * 0.1, bY + oy - 4); ctx.lineTo(x + ox + w2 * 0.2, bY + oy - 8); ctx.lineTo(x + ox + w2 * 0.55, bY + oy - 6); ctx.closePath(); ctx.fill();
        });
        ctx.fillStyle = "#FFF"; ctx.beginPath(); ctx.arc(x, bY - 100, 3, 0, Math.PI * 2); ctx.fill();
        return;
    }
    ctx.fillStyle = "#6B4423"; ctx.fillRect(x - 6, bY - 44, 12, 44);
    if (season === "autumn") {
        ctx.fillStyle = "#8B4513"; ctx.fillRect(x - 4, bY - 80, 8, 36);
        const colors = ["#D4420F", "#E8841A", "#F5A623", "#C0392B"];
        for (let i = 0; i < 4; i++) { ctx.fillStyle = colors[i % colors.length]; ctx.beginPath(); ctx.arc(x + [-12, 12, -6, 6][i], bY - 80 - [20, 18, 38, 36][i], 16, 0, Math.PI * 2); ctx.fill(); }
        ctx.fillStyle = "#E8841A"; ctx.beginPath(); ctx.arc(x, bY - 95, 20, 0, Math.PI * 2); ctx.fill();
    } else if (season === "summer") {
        ctx.fillStyle = "#E67E22"; ctx.beginPath(); ctx.arc(x, bY - 62, 28, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#D35400"; ctx.beginPath(); ctx.arc(x - 8, bY - 78, 18, 0, Math.PI * 2); ctx.arc(x + 8, bY - 78, 18, 0, Math.PI * 2); ctx.fill();
    } else {
        ctx.fillStyle = "#1A7A1A"; ctx.beginPath(); ctx.arc(x, bY - 62, 28, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#0F5E0F"; ctx.beginPath(); ctx.arc(x - 6, bY - 78, 18, 0, Math.PI * 2); ctx.arc(x + 6, bY - 78, 18, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#1F8B1F"; ctx.beginPath(); ctx.arc(x, bY - 90, 14, 0, Math.PI * 2); ctx.fill();
        // سایه‌ی سه‌بعدی درخت
        if (gfxQ >= 2) {
            ctx.fillStyle = "rgba(0,50,0,0.2)"; ctx.beginPath(); ctx.arc(x + 5, bY - 58, 24, 0, Math.PI * 2); ctx.fill();
            // برگ‌های ریز براق
            ctx.fillStyle = "rgba(100,220,100,0.5)";
            ctx.beginPath(); ctx.arc(x - 10, bY - 72, 3.5, 0, Math.PI * 2); ctx.arc(x + 8, bY - 85, 3, 0, Math.PI * 2); ctx.fill();
        }
    }
}

}

// بشقاب‌پرنده
function drawUFO(dx, gY, en, al) {
    const y = gY - (en.hoverY + Math.sin(en.hoverPhase) * 10);
    ctx.save(); ctx.globalAlpha = al;
    // پرتوی جاذبه
    if (en.beam > 0) {
        ctx.save(); ctx.globalAlpha = al * (0.16 + Math.abs(Math.sin(globalFrame * 0.3)) * 0.2);
        ctx.fillStyle = "#69F0AE";
        ctx.beginPath(); ctx.moveTo(dx - 9, y + 8); ctx.lineTo(dx + 9, y + 8); ctx.lineTo(dx + 26, gY); ctx.lineTo(dx - 26, gY); ctx.closePath(); ctx.fill();
        ctx.restore();
    }
    // بدنه
    ctx.fillStyle = "#37474F"; ctx.beginPath(); ctx.ellipse(dx, y + 4, 27, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#78909C"; ctx.beginPath(); ctx.ellipse(dx, y, 26, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#B0BEC5"; ctx.beginPath(); ctx.ellipse(dx - 6, y - 3, 11, 3, 0, 0, Math.PI * 2); ctx.fill();
    // گنبد
    ctx.fillStyle = "rgba(129,236,255,0.82)"; ctx.beginPath(); ctx.arc(dx, y - 3, 12, Math.PI, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = "#43A047"; ctx.beginPath(); ctx.arc(dx, y - 6, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#0B1016"; ctx.beginPath(); ctx.arc(dx + 1.5, y - 7, 2, 0, Math.PI * 2); ctx.fill();
    // چراغ‌ها
    for (let i = -2; i <= 2; i++) {
        const on = (Math.floor(globalFrame / 7) + i + 5) % 5 === 0;
        ctx.fillStyle = on ? "#FFEB3B" : "#FF7043";
        ctx.beginPath(); ctx.arc(dx + i * 9, y + 5, 2.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
}

function drawCave(cv, cO, season) {
    const dS = cv.x1 - cO, dE = cv.x2 - cO;
    if (dE < -60 || dS > canvas.width + 60) return;
    const th = THEMES[season];
    ctx.save();

    ctx.lineTo(dE, cv.floorY + 28); ctx.closePath();

    for (let wx = cv.x1; wx <= cv.x2; wx += 14) ctx.lineTo(wx - cO, cv.floorY + Math.sin(wx / 70) * 2);

    ctx.strokeStyle = season === "winter" ? "#8FA3B3" : season === "mars" ? "#A83800" : "#6D5238"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(dS, cv.floorY); ctx.lineTo(dE, cv.floorY); ctx.stroke();

        ctx.fillStyle = "rgba(0,0,0,0.1)";
        for (let wx = cv.x1 + 20; wx < cv.x2 - 20; wx += 34) {
            const fy = cv.floorY + 8 + hash01(wx * 0.3) * 16;

    const r = clamp((n >> 16) + p, 0, 255), g = clamp(((n >> 8) & 255) + p, 0, 255), b = clamp((n & 255) + p, 0, 255);
    return "rgb(" + r + "," + g + "," + b + ")";

function drawGroundAndBackground() {
    const s = getSeason(), th = THEMES[s], W = canvas.width, H = canvas.height;
    const cO = player.worldX - screenX;
    const vL = cO - 60, vR = cO + W + 60;   // پنجره‌ی دید در مختصات جهان
    drawSky();
    drawParallaxHills();
    ctx.save(); ctx.translate(0, -camY);

    // ---- زمین ----
    ctx.beginPath(); ctx.moveTo(0, H + camY);
    for (let sx = 0; sx <= W; sx += 14) ctx.lineTo(sx, baseGroundHeightAt(sx + cO));
    ctx.lineTo(W, H + camY); ctx.closePath();
    ctx.fillStyle = vGrad("gnd" + s, 300, H, [[0, th.groundTop], [0.25, th.ground], [1, s === "spring" ? "#1E5C17" : s === "summer" ? "#8B560E" : s === "winter" ? "#8FA6B8" : "#5E2F0C"]]);
    ctx.fill();
    // نوار بالای زمین
    ctx.beginPath();
    for (let sx = 0; sx <= W; sx += 14) { const gy = baseGroundHeightAt(sx + cO); if (sx === 0) ctx.moveTo(sx, gy + 3); else ctx.lineTo(sx, gy + 3); }
    ctx.strokeStyle = th.groundTop; ctx.lineWidth = 7; ctx.stroke();
    ctx.beginPath();
    for (let sx = 0; sx <= W; sx += 14) { const gy = baseGroundHeightAt(sx + cO); if (sx === 0) ctx.moveTo(sx, gy); else ctx.lineTo(sx, gy); }
    ctx.strokeStyle = th.groundLine; ctx.lineWidth = 1.5; ctx.stroke();
    // بافت خاک (سبک و قطعی)
    ctx.fillStyle = "rgba(0,0,0,0.11)";
    if (gfxQ > 0) {
        const tStep = gfxQ === 2 ? 46 : 80, tBase = Math.floor(cO / tStep) * tStep;
        for (let wx = tBase; wx < cO + W + tStep; wx += tStep) {
        const h1 = hash01(wx), gy = baseGroundHeightAt(wx);
        ctx.fillRect(wx - cO + h1 * 20, gy + 16 + h1 * 30, 3, 3);
        ctx.fillRect(wx - cO + hash01(wx + 7) * 26, gy + 54 + hash01(wx + 3) * 26, 2, 2);
        }
    }

    // ---- چاله‌ها ----
    for (let i = 0; i < currentPits.length; i++) {
        const p = currentPits[i];
        if (p.end < vL || p.start > vR) continue;
        const dS = p.start - cO, dE = p.end - cO;
        ctx.beginPath(); ctx.moveTo(dS, H + camY);
        for (let sx = dS; sx <= dE; sx += 10) ctx.lineTo(sx, baseGroundHeightAt(sx + cO));
        ctx.lineTo(dE, H + camY); ctx.closePath();
        const pitC = s === "summer" ? "#E8912D" : s === "autumn" ? "#A84E10" : s === "winter" ? "#0288D1" : s === "mars" ? "#BF360C" : s === "space" ? "#1A0A3D" : "#4FA8D8";
        ctx.fillStyle = vGrad("pit" + s, 330, H, [[0, th.pitWater], [1, pitC]]);
        ctx.fill();
        const gS = baseGroundHeightAt(p.start), gE = baseGroundHeightAt(p.end);
        // دیواره‌های چاله با سایه
        ctx.fillStyle = th.dirt; ctx.fillRect(dS - 6, gS, 7, H + camY - gS); ctx.fillRect(dE - 1, gE, 7, H + camY - gE);
        ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.fillRect(dS - 6, gS, 7, 10); ctx.fillRect(dE - 1, gE, 7, 10);
        // موج/بخار بالای چاله (فقط High)
        if (gfxQ >= 2 && (s === "mars" || s === "spring")) {
            ctx.save(); ctx.globalAlpha = 0.15 + Math.abs(Math.sin(globalFrame * 0.04 + p.start)) * 0.12;
            ctx.fillStyle = s === "mars" ? "#FF3D00" : "#81D4FA";
            for (let k = 0; k < 3; k++) {
                const mx = dS + (dE - dS) * (0.2 + k * 0.3), my = baseGroundHeightAt(p.start + (p.end - p.start) * (0.2 + k * 0.3)) - 4 - Math.sin(globalFrame * 0.05 + k) * 3;
                ctx.beginPath(); ctx.ellipse(mx, my, 10 + k * 3, 3, 0, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }
    }

    // ---- پوشش گیاهی (پنجره‌ای) ----
    eachInView(treesAndBushes, vL - 90, vR + 90, it => {
        const by = baseGroundHeightAt(it.x);
        if (it.type === "crater") drawCrater(it.x - cO, by, it.s); else if (it.type === "moonrock") drawMoonRock(it.x - cO, by, it.s); else if (it.type === "tree") drawTree(it.x - cO, by, s); else if (s === "summer") drawRock(it.x - cO, by); else drawBush(it.x - cO, by, s);
    });
    if (s !== "space" && s !== "mars") eachInView(grassTufts, vL, vR, g => drawGrassTuft(g.x - cO, baseGroundHeightAt(g.x), g.lean, g.height, s, g.flower));
    eachInView(fruits, vL, vR, fr => { if (!fr.collected) drawFruit(fr.x - cO, fr.y + Math.sin(globalFrame * 0.04 + fr.bob) * 3); });

    for (let i = 0; i < pipes.length; i++) { const p = pipes[i]; if (p.x < vL || p.x > vR) continue; drawPipe(p.x - cO, baseGroundHeightAt(p.x), p, s === "summer" || s === "autumn"); }
    for (let i = 0; i < caves.length; i++) if (caves[i].found) drawCave(caves[i], cO, s);
    for (let i = 0; i < platforms.length; i++) {
        const pl = platforms[i]; if (pl.x < vL - pl.w || pl.x > vR + pl.w) continue;
        if (pl.cave && !pl.cave.found) continue;
        drawPlatform(pl.x - cO, pl.y, pl.w, s, pl.x);
    }
    for (let i = 0; i < blocks.length; i++) { const b = blocks[i]; if (b.x < vL || b.x > vR || (b.hit && b.fadeTimer > 20)) continue; drawMysteryBlock(b.x - cO, baseGroundHeightAt(b.x), b.fadeTimer, b.hit, b.extra, b.x); }
    for (let i = 0; i < droppedItems.length; i++) { const it = droppedItems[i]; if (it.collected || it.x < vL || it.x > vR) continue; drawDroppedItem(it, it.x - cO); }

    eachInView(coins, vL, vR, c => {
        if (c.collected || (c.cave && !c.cave.found)) return;
        drawCoin(c.x - cO, c.py !== undefined ? c.py : baseGroundHeightAt(c.x) - c.heightOffset, c.x);
    });
    for (let i = 0; i < stars.length; i++) {
        const st = stars[i]; if (st.collected || st.x < vL || st.x > vR) continue;
        if (st.cave && !st.cave.found) continue;
        drawWorldStar(st.x - cO, st.y !== undefined ? st.y : baseGroundHeightAt(st.x) - 42, st.x);
    }
    for (let i = 0; i < arrowPickups.length; i++) {
        const a = arrowPickups[i]; if (a.collected || a.x < vL || a.x > vR) continue;
        if (a.cave && !a.cave.found) continue;
        drawProjectile(a.x - cO, (a.py !== undefined ? a.py : baseGroundHeightAt(a.x) - 22) + Math.sin(globalFrame * 0.06 + a.x) * 4, 1, Math.sin(globalFrame * 0.05 + a.x) * 0.3, s);
    }
    for (let i = 0; i < enemies.length; i++) {
        const en = enemies[i];
        if (!en.alive && (!en.dying || en.deathTimer > 30)) continue;
        if (en.x < vL || en.x > vR) continue;
        if (en.cave && !en.cave.found) continue;
        const dx = en.x - cO, al = en.dying ? clamp(1 - en.deathTimer / 30, 0, 1) : 1;
        const gy = en.cave ? en.cave.floorY : baseGroundHeightAt(en.x);
        const sl = (en.cave || isInPit(en.x, currentPits)) ? 0 : slopeAt(en.x);
        if (en.alive && en.kind !== "ufo" && en.kind !== "marsbat") drawShadow(dx, gy, (en.kind === "wolf" || en.kind === "lavaworm") ? 19 : 16);
        if (en.kind === "snail") drawSnail(dx, gy, en.facing, al, sl);
        else if (en.kind === "cactus") drawCactus(dx, gy, al, sl);
        else if (en.kind === "hunter") drawHunter(dx, gy, en.facing, al, sl);
        else if (en.kind === "bossTree") drawBossTree(dx, gy, en.facing, al, sl);
        else if (en.kind === "snowman") drawSnowman(dx, gy, en.facing, al, sl, en.x);
        else if (en.kind === "wolf") drawWolf(dx, gy, en.facing, al, sl, (en.lunge || 0) > 60, en.x);
        else if (en.kind === "slime") drawSlime(dx, gy, en.facing, al, en.hopH || 0);
        else if (en.kind === "alien") drawAlienEnemy(dx, gy, en.facing, al, sl);
        else if (en.kind === "ufo") drawUFO(dx, gy, en, al);
        else if (en.kind === "fireslime") drawSlime(dx, gy, en.facing, al, en.hopH || 0, true);
        else if (en.kind === "lavaworm") drawLavaWorm(dx, gy, en.facing, al, sl);
        else if (en.kind === "marsbat") drawMarsBat(dx, gy, en, al);
        else drawHedgehog(dx, gy, en.facing, al, sl, en.x);
    }
    for (let i = 0; i < icicles.length; i++) { const ic = icicles[i]; if (ic.x < vL || ic.x > vR) continue; drawIcicle(ic.x - cO, ic); }
    for (let i = 0; i < bossProjectiles.length; i++) {
        const bp = bossProjectiles[i]; if (bp.x < vL || bp.x > vR) continue;
        const dx = bp.x - cO;
        if (bp.fire) {
            if (!bp.hit) {
                if (bp.vy === undefined) bp.vy = -5;
                bp.vy += 0.22; bp.y += bp.vy; bp.x += bp.dir * 2.5;
                const gy2 = baseGroundHeightAt(bp.x);
                if (bp.y > gy2) { bp.hit = true; burst(bp.x, gy2, {n:6, colors:["#FF9800","#FF3D00"], spd:2.2, size:2.5}); }
                if (invulnFrames <= 0 && Math.abs(bp.x - player.worldX) < 18 && Math.abs(bp.y - (player.y+25)) < 22) { loseLife(); bp.hit = true; }
                ctx.save(); ctx.translate(dx, bp.y); ctx.rotate(globalFrame * 0.25 + bp.x);
                ctx.fillStyle = "#FF9800"; ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#FF3D00"; ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#FFF176"; ctx.beginPath(); ctx.arc(-1, -1.5, 2, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }
        } else if (bp.laser) {
            ctx.save(); ctx.globalAlpha = 0.9;
            ctx.fillStyle = "#69F0AE"; ctx.fillRect(dx - 11, bp.y - 2.5, 22, 5);
            ctx.fillStyle = "#E0FFF0"; ctx.fillRect(dx - 7, bp.y - 1, 14, 2);
            ctx.restore();
        } else if (bp.snow) {
            ctx.save(); ctx.translate(dx, bp.y); ctx.rotate(globalFrame * 0.15 * bp.dir);
            ctx.fillStyle = "#E1F5FE"; ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(-2, -2, 4, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        } else {
            ctx.fillStyle = "#FF5722"; ctx.beginPath(); ctx.ellipse(dx, bp.y, 10, 5, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#FFCCBC"; ctx.beginPath(); ctx.ellipse(dx - 3, bp.y - 1, 4, 2, 0, 0, Math.PI * 2); ctx.fill();
        }
    }
    for (let i = 0; i < arrows.length; i++) { const a = arrows[i]; drawProjectile(a.x - cO, a.y, a.dir, s === "space" ? 0 : (globalFrame * 0.3) % 6.28, s); }
    drawFloatTexts(cO);
    drawParticles(cO);

    if (boss && boss.alive) {
        const dx = boss.x - cO;
        if (dx > -90 && dx < W + 90) {
            const gy = baseGroundHeightAt(boss.x), f = boss.facing || 1, cfgB = activeLevels()[currentLevel], sl = slopeAt(boss.x);
            drawShadow(dx, gy, 34);
            if (boss.reviveT > 0) { ctx.save(); ctx.globalAlpha = 0.45 + Math.abs(Math.sin(globalFrame * 0.4)) * 0.55; }
            else if (boss.hitFlash > 0) { ctx.save(); ctx.globalAlpha = 0.6; }
            else ctx.save();
            if (cfgB.bossType === "orc") drawBossOrc(dx, gy, f, sl);
            else if (cfgB.bossType === "iron") drawBossIron(dx, gy, f, sl);
            else if (cfgB.bossType === "frostKing") drawBossFrostKing(dx, gy, f, sl);
            else if (cfgB.bossType === "alienQueen") drawBossAlienQueen(dx, gy, f, sl);
            else if (cfgB.bossType === "lavaTitan") drawBossLavaTitan(dx, gy, f, sl);
            else drawBossTreeKing(dx, gy, f, sl);
            ctx.restore();
            // هاله‌ی خشم در مرحله‌های بالاتر
            if (boss.rage > 0.01) {
                ctx.save(); ctx.globalAlpha = 0.16 + Math.abs(Math.sin(globalFrame * 0.08)) * 0.14;
                ctx.fillStyle = "#FF1744"; ctx.beginPath(); ctx.ellipse(dx, gy - 70, 52, 82, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            }
        }
    }

    const cfg = activeLevels()[currentLevel];
    if (!cfg.isBoss) {
        const fX = LEVEL_LENGTH - cO;
        if (fX > -20 && fX < W + 40) {
            const fy = baseGroundHeightAt(LEVEL_LENGTH);
            ctx.strokeStyle = "#555"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(fX, fy); ctx.lineTo(fX, fy - 70); ctx.stroke();
            const wv = Math.sin(globalFrame * 0.08) * 3;
            ctx.fillStyle = "#E53935"; ctx.beginPath(); ctx.moveTo(fX, fy - 70); ctx.quadraticCurveTo(fX + 16, fy - 65 + wv, fX + 28, fy - 60); ctx.lineTo(fX, fy - 50); ctx.closePath(); ctx.fill();
        }
    }
    ctx.restore();
}

function drawHeadMarker(cx, cy, key) {
    const PAL = { boy: ["#F5C089", "#3E2723"], girl: ["#F7CCA1", "#5D2A12"], robot: ["#B0BEC5", null], alien: ["#8BC34A", null], knight: ["#78909C", null], ninja: ["#263238", null], skeleton: ["#ECEFF1", null], wizard: ["#F5C089", "#4A148C"], ghost: ["#EEF4FF", null], viking: ["#FFCC80", "#E65100"], cat: ["#FFF3C4", "#FF8F00"], fox: ["#FFE0B2", "#E64A19"], bear: ["#EFEBE9", "#5D4037"], dragon: ["#FFF59D", "#1B5E20"] };
    const p = PAL[key] || PAL.boy;
    ctx.save(); ctx.translate(cx, cy);
    // حلقه‌ی سفید دور سر
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, 11.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.beginPath(); ctx.arc(0, 1.5, 11.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, 10.5, 0, Math.PI * 2); ctx.fill();
    // صورت
    ctx.fillStyle = p[0]; ctx.beginPath(); ctx.arc(0, 0.5, 8.4, 0, Math.PI * 2); ctx.fill();
    // مو / کلاه
    if (p[1]) { ctx.fillStyle = p[1]; ctx.beginPath(); ctx.arc(0, -0.5, 8.4, Math.PI * 1.03, Math.PI * 2.02); ctx.fill(); }
    if (key === "cat" || key === "fox") { ctx.fillStyle = p[1]; ctx.beginPath(); ctx.moveTo(-7, -4); ctx.lineTo(-9, -11); ctx.lineTo(-2, -7); ctx.closePath(); ctx.moveTo(7, -4); ctx.lineTo(9, -11); ctx.lineTo(2, -7); ctx.closePath(); ctx.fill(); }
    if (key === "bear") { ctx.fillStyle = p[1]; ctx.beginPath(); ctx.arc(-6.5, -6, 3.4, 0, Math.PI * 2); ctx.arc(6.5, -6, 3.4, 0, Math.PI * 2); ctx.fill(); }
    if (key === "knight") { ctx.fillStyle = "#37474F"; ctx.fillRect(-6, -2.5, 12, 4); }
    if (key === "ninja") { ctx.fillStyle = "#BDBDBD"; ctx.fillRect(-8, -3, 16, 4.5); }
    if (key === "robot") { ctx.fillStyle = "#37474F"; ctx.fillRect(-6, -3, 12, 6); }
    // چشم‌ها
    if (key === "robot") { ctx.fillStyle = "#FF5252"; ctx.beginPath(); ctx.arc(-2.5, 0, 1.5, 0, Math.PI * 2); ctx.arc(2.5, 0, 1.5, 0, Math.PI * 2); ctx.fill(); }

        ctx.strokeStyle = "rgba(90,50,20,0.75)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 3, 2.6, 0.2, Math.PI - 0.2); ctx.stroke();
    }
    ctx.restore();
}

function drawProgressBar() {
    const cfg = activeLevels()[currentLevel]; const bW = 240, bH = 18, x = canvas.width / 2 - bW / 2, y = 16;
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.3)"; ctx.shadowBlur = 5; ctx.shadowOffsetY = 2;

    ctx.restore();

        const pct = boss ? clamp(boss.health / (boss.maxHealth || cfg.bossHealth), 0, 1) : 0;
        if (pct > 0) { ctx.fillStyle = vGrad("hpBar", y, y + bH, [[0, "#FF6B6B"], [1, "#C62828"]]); roundRect(x, y, Math.max(10, bW * pct), bH, 9); ctx.fill(); }
        ctx.strokeStyle = "#333"; ctx.lineWidth = 2; roundRect(x, y, bW, bH, 9); ctx.stroke();
        ctx.fillStyle = "#fff"; ctx.font = F(12); ctx.textAlign = "center";
        ctx.fillText(t("bossHP") + (boss && boss.phases > 1 ? "  " + boss.phase + "/" + boss.phases : ""), x + bW / 2, y + 14);
        // نشانگر مرحله‌های غول
        if (boss && boss.phases > 1) {
            for (let i = 0; i < boss.phases; i++) {
                const px2 = x + bW / 2 - (boss.phases - 1) * 8 + i * 16, py2 = y + bH + 8;
                ctx.beginPath(); ctx.arc(px2, py2, 5, 0, Math.PI * 2);

            }
        }
        ctx.textAlign = "start";
        return;
    }
    // پرشده‌ی نوار
    const fr = clamp(progressPercent / 100, 0, 1);
    if (fr > 0.008) {
        ctx.fillStyle = vGrad("pgBar", y, y + bH, [[0, "#FFE55C"], [0.5, "#FFC107"], [1, "#FF9800"]]); roundRect(x, y, Math.max(10, bW * fr), bH, 9); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.35)"; roundRect(x + 2, y + 2, Math.max(6, bW * fr - 4), bH / 2 - 1, 5); ctx.fill();
    }
    ctx.strokeStyle = "rgba(40,40,40,0.85)"; ctx.lineWidth = 2; roundRect(x, y, bW, bH, 9); ctx.stroke();
    // پرچم پایان
    ctx.strokeStyle = "#455A64"; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x + bW + 4, y - 3); ctx.lineTo(x + bW + 4, y + bH + 2); ctx.stroke();
    ctx.fillStyle = "#E53935"; ctx.beginPath(); ctx.moveTo(x + bW + 4, y - 3); ctx.lineTo(x + bW + 12, y + 1); ctx.lineTo(x + bW + 4, y + 5); ctx.closePath(); ctx.fill();
    // درصد
    ctx.fillStyle = "#fff"; ctx.font = F(11, 900); ctx.textAlign = "center";
    ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 2;
    ctx.fillText(Math.floor(progressPercent) + "%", x + bW / 2, y + 13); 
    ctx.shadowBlur = 0; ctx.textAlign = "start";
    // ===== نشانگر سر بازیکن =====
    const hx2 = x + bW * fr;
    const hop = (keys.left || keys.right) ? Math.abs(Math.sin(frameCount * 0.24)) * 2 : 0;
    ctx.save();
    ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(hx2, y + bH); ctx.lineTo(hx2, y - 6); ctx.stroke();
    drawHeadMarker(hx2, y - 13 - hop, selectedSkin);
    ctx.restore();
}

}
function drawTouchControls() {

        ctx.fillStyle = pressed ? "#A5D6A7" : "#fff";

        ctx.restore();

// ===================== گردونه‌ی شانس =====================
function pickWheelSlice() {
    const affordable = Object.keys(SKINS).filter(k => !SKINS[k].owned && SKINS[k].price <= 2000);
    const pool = WHEEL.filter(s => s.t !== "skin" || affordable.length > 0);
    let tot = 0; pool.forEach(s => tot += s.w);
    let r = Math.random() * tot;
    for (let i = 0; i < pool.length; i++) { r -= pool[i].w; if (r <= 0) return WHEEL.indexOf(pool[i]); }
    return 1;
}
function startSpin() {
    if (wheelState !== "idle" || availableSpins() <= 0) return;
    starsSpent += 10;
    const idx = pickWheelSlice();
    const seg = (Math.PI * 2) / WHEEL.length;
    // زاویه‌ای که مرکز بخش idx زیر نشانگر بالا بیاید
    const center = idx * seg + seg / 2;
    wheelTarget = (Math.PI * 2) * (5 + Math.floor(Math.random() * 2)) + (-Math.PI / 2 - center);
    wheelAngle = wheelAngle % (Math.PI * 2);
    wheelSpin = 0; wheelState = "spinning"; wheelResult = idx; saveGame();
}
function updateWheel() {
    if (wheelState !== "spinning") { if (wheelResultTimer > 0) wheelResultTimer--; return; }
    wheelSpin += 0.016;
    const p = clamp(wheelSpin, 0, 1);
    const ease = 1 - Math.pow(1 - p, 3.4);
    wheelAngle = wheelTarget * ease;
    if (p >= 1) {
        wheelState = "idle"; wheelResultTimer = 200;
        const s = WHEEL[wheelResult];
        if (s.t === "coin") { totalCoins += s.v; floatTexts.push({ x: 0, y: 0, txt: "", color: "#fff", life: 60 }); }
        else if (s.t === "shield") shieldInventory++;
        else if (s.t === "skin") {
            const aff = Object.keys(SKINS).filter(k => !SKINS[k].owned && SKINS[k].price <= 2000);
            if (aff.length) { const k = aff[Math.floor(Math.random() * aff.length)]; SKINS[k].owned = true; wheelResult = { skinKey: k, idx: wheelResult }; }
            else totalCoins += 50;
        }
        for (let i = 0; i < 26; i++) burstUI(canvas.width / 2, 210, s.color);
        saveGame();
    }
}
const uiParticles = [];
function burstUI(x, y, color) {
    const a = Math.random() * Math.PI * 2, v = 1.5 + Math.random() * 3.5;
    uiParticles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, life: 0, max: 40 + Math.random() * 20, color, size: 2.5 + Math.random() * 3 });
}
function drawUIParticles() {
    for (let i = uiParticles.length - 1; i >= 0; i--) {
        const p = uiParticles[i]; p.life++; p.x += p.vx; p.y += p.vy; p.vy += 0.13;
        if (p.life > p.max) { uiParticles.splice(i, 1); continue; }
        ctx.save(); ctx.globalAlpha = clamp(1 - p.life / p.max, 0, 1); ctx.fillStyle = p.color;
        ctx.translate(p.x, p.y); ctx.rotate(p.life * 0.15); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.5); ctx.restore();
    }
}

function checkDailyReward() {
    const today = new Date().toISOString().slice(0, 10);
    if (lastDailyDate === today) return;
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    if (lastDailyDate !== yesterday) dailyStreak = 0;
    dailyStreak++;
    lastDailyDate = today;
    const coins = dailyStreak >= 8 ? DAILY_COINS_8PLUS : (DAILY_COINS[dailyStreak] || 1000);
    totalCoins += coins;
    dailyReward = coins;
    dailyItem = "";
    if (dailyStreak >= 4) {
        const items = ["shield", "shoe", "thunder", "clock"];
        const it = items[dailyStreak % items.length];
        if (it === "shield") shieldInventory++;
        else if (it === "shoe") shoeInventory++;
        else if (it === "thunder") thunderInventory++;
        dailyItem = it;
    }
    if (dailyStreak >= 8) {
        extraLifeInventory++;
        dailyItem = "extraLife";
    }
    dailyPopup = true;
    saveGame();
}

    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 20;
    ctx.fillStyle = "rgba(30, 40, 65, 0.88)";
    roundRect(px, py, pw, ph, 22); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.lineWidth = 2;
    roundRect(px, py, pw, ph, 22); ctx.stroke();
    ctx.restore();
    
    // آیکون پاز
    ctx.fillStyle = "#fff";
    ctx.fillRect(W / 2 - 16, py + 28, 11, 34);
    ctx.fillRect(W / 2 + 5, py + 28, 11, 34);
    
    ctx.fillStyle = "rgba(255,255,255,0.75)"; ctx.font = F(20, 400, true); ctx.textAlign = "center";
    ctx.fillText(lang === "fa" ? "متوقف شده" : "PAUSED", W / 2, py + 92);
    ctx.textAlign = "start";
    
    const bw = 240, bh = 50, cx = W / 2 - bw / 2;
    endButtons = [
        Object.assign(rect(cx, py + 110, bw, bh), { label: t("continueGame"), color: "#4CAF50", action: () => gameState = "playing" }),
        Object.assign(rect(cx, py + 172, bw, bh), { label: t("restart"), color: "#FF9800", action: () => { initLevel(currentLevel); gameState = "playing"; } }),
        Object.assign(rect(cx, py + 234, bw, bh), { label: t("menu"), color: "#455A64", action: () => gameState = "menu" })
    ];
    endButtons.forEach(drawButton);
}

// ===================== LOOP =====================
function gameLoop() {
    globalFrame++;
    ctx.direction = lang === "fa" ? "rtl" : "ltr";
    if (gameState === "playing") {
        updatePlaying();
        if (gameState === "playing") drawPlayingScreen();
        else if (gameState === "win") drawEndScreen(true);
        else if (gameState === "lose") drawEndScreen(false);
        else if (gameState === "tutorial") { tutorialTimer = 0; drawTutorial(); }
    } else if (gameState === "tutorial") {
        tutorialTimer++;
        drawTutorial();
        if (tutorialTimer >= TUTORIAL_DURATION) { tutorialState = "done"; gameState = "playing"; }
    } else if (gameState === "menu") drawMenu();
    else if (gameState === "levels") drawLevels();
    else if (gameState === "shop") drawShop();
    else if (gameState === "settings") drawSettings();
    else if (gameState === "wheel") drawWheelScreen();
    else if (gameState === "cutscene") drawCutscene();
    else if (gameState === "cheat") drawCheatScreen();
    else if (gameState === "paused") drawPaused();
    else if (gameState === "win") drawEndScreen(true);
    else if (gameState === "lose") drawEndScreen(false);
    requestAnimationFrame(gameLoop);
}

// ===================== PWA: نصب و اجرای آفلاین =====================
let deferredPrompt = null, installBtnRect = { x: 0, y: 0, w: 0, h: 0 }, installHint = 0;
const isStandalone = window.matchMedia && (window.matchMedia("(display-mode: standalone)").matches || window.matchMedia("(display-mode: fullscreen)").matches) || navigator.standalone === true;
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredPrompt = e; installHint = 260; });
window.addEventListener("appinstalled", () => { deferredPrompt = null; installHint = 0; });
function doInstall() {
    if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then(() => { deferredPrompt = null; }); }
    else goFullscreen();
}
function goFullscreen() {
    const el = document.documentElement;
    const rq = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (rq && !document.fullscreenElement) { try { rq.call(el); } catch (e) { } }
    if (screen.orientation && screen.orientation.lock) { try { screen.orientation.lock("landscape").catch(() => {}); } catch (e) { } }
}
// اولین لمس روی موبایل: تمام‌صفحه + قفل افقی
let fsDone = false;
canvas.addEventListener("touchend", () => { if (!fsDone) { fsDone = true; goFullscreen(); } }, { passive: true });

function drawInstallButton() {
    if (isStandalone) return;
    installBtnRect = rect(20, canvas.height - 62, 150, 44);
    const b = Object.assign({}, installBtnRect, { label: (deferredPrompt ? "⬇ " : "⛶ ") + (lang === "fa" ? (deferredPrompt ? "نصب بازی" : "تمام‌صفحه") : (deferredPrompt ? "Install" : "Fullscreen")), color: deferredPrompt ? "#00897B" : "#455A64" });
    drawButton(b);
    if (installHint > 0) {
        installHint--;
        ctx.save();
        ctx.globalAlpha = clamp(installHint / 60, 0, 1);
        ctx.fillStyle = "rgba(0,0,0,0.65)"; roundRect(20, canvas.height - 108, 232, 38, 9); ctx.fill();
        ctx.fillStyle = "#B2DFDB"; ctx.font = F(12, 700); ctx.textAlign = "center";
        ctx.fillText(lang === "fa" ? "برای نصب روی گوشی بزن!" : "Tap to install on your phone!", 136, canvas.height - 84);
        ctx.restore(); ctx.textAlign = "start";
    }
}

loadGame();
resizeGame();
gameLoop();
</script>

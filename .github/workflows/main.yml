name: Build Android APK

on:
  # با هر push روی main یا branch جلسه
  push:
    branches:
      - main
      - arena/**
  # با هر pull request
  pull_request:
    branches:
      - main
  # اجرای دستی از تب Actions
  workflow_dispatch:

# اجازه‌ی نوشتن برای ساختن release و آپلود APK
permissions:
  contents: write

jobs:
  build:
    name: ساخت APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4

      - name: 🟢 نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📂 ساخت پوشه dist و کپی index.html
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          # اگه فایل manifest یا آیکن لازم بود همین‌جا کپی کن
          for f in manifest.webmanifest icon-192.png apple-touch-icon.png icon-512.png icon-512-maskable.png; do
            if [ -f "$f" ]; then cp "$f" "dist/$f"; fi
          done
          ls -la dist/

      - name: 📦 نصب Capacitor
        run: |
          npm init -y > /dev/null
          npm install --save @capacitor/core@^6 @capacitor/android@^6 @capacitor/cli@^6
          npx cap --version

      - name: ⚙️ ساخت فایل تنظیمات Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "ir.artam.adventuregame",
            "appName": "بازی ماجراجویی",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": true,
              "backgroundColor": "#0b0f18"
            },
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          cat capacitor.config.json

      - name: ➕ افزودن پلتفرم اندروید
        run: npx cap add android

      - name: 🔄 همگام‌سازی فایل‌های وب
        run: npx cap sync android

      - name: 🔨 ساخت APK دیباگ
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 آپلود APK به‌عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🏷️ ایجاد/به‌روزرسانی Release v1.0.0 با APK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          echo "📦 APK info:"
          ls -la "$APK"
          echo "Repo: ${{ github.repository }}"

          # بررسی اینکه release وجود داره یا نه (با jq نه python)
          echo "🔍 Checking if release v1.0.0 exists..."
          HTTP_CODE=$(curl -sS -o /tmp/release.json -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v1.0.0")
          echo "HTTP: $HTTP_CODE"
          cat /tmp/release.json | head -20
          echo ""

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Release exists — extracting id..."
            RELEASE_ID=$(grep -oE '"id": *[0-9]+' /tmp/release.json | head -1 | grep -oE '[0-9]+')
            echo "Release ID: $RELEASE_ID"
          else
            echo "📝 Release does not exist — creating..."
            curl -sS -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${{ github.repository }}/releases" \
              -d "{\"tag_name\":\"v1.0.0\",\"name\":\"بازی ماجراجویی — نسخه ۱.۰.۰\",\"body\":\"نسخه ۱.۰.۰ بازی ماجراجویی. APK به‌صورت خودکار توسط GitHub Actions ساخته شده است.\",\"draft\":false,\"prerelease\":false}" \
              -o /tmp/release.json
            cat /tmp/release.json | head -20
            echo ""
            RELEASE_ID=$(grep -oE '"id": *[0-9]+' /tmp/release.json | head -1 | grep -oE '[0-9]+')
            echo "New Release ID: $RELEASE_ID"
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "❌ Could not determine release id"
            exit 1
          fi

          echo "🚀 Uploading APK..."
          UPLOAD_URL="https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=app-debug.apk"
          HTTP_STATUS=$(curl -sS -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$APK" \
            -o /tmp/upload.json \
            -w "%{http_code}" \
            "$UPLOAD_URL")
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/upload.json | head -10
          echo ""

          if [ "$HTTP_STATUS" = "201" ]; then
            echo "✅ APK uploaded successfully"
          else
            echo "❌ Upload failed with status $HTTP_STATUS"
            exit 1
          fi
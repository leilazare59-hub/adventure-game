name: Build Android APK

on:
  # با هر push روی main یا branch جلسه
  push:
    branches:
      - main
      - arena/**
  # با هر pull request
  pull_request:
    branches:
      - main
  # اجرای دستی از تب Actions
  workflow_dispatch:

# اجازه‌ی نوشتن برای ساختن release و آپلود APK
permissions:
  contents: write

jobs:
  build:
    name: ساخت APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4

      - name: 🟢 نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📂 ساخت پوشه dist و کپی index.html
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          # اگه فایل manifest یا آیکن لازم بود همین‌جا کپی کن
          for f in manifest.webmanifest icon-192.png apple-touch-icon.png icon-512.png icon-512-maskable.png; do
            if [ -f "$f" ]; then cp "$f" "dist/$f"; fi
          done
          ls -la dist/

      - name: 📦 نصب Capacitor
        run: |
          npm init -y > /dev/null
          npm install --save @capacitor/core@^6 @capacitor/android@^6 @capacitor/cli@^6
          npx cap --version

      - name: ⚙️ ساخت فایل تنظیمات Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "ir.artam.adventuregame",
            "appName": "بازی ماجراجویی",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": true,
              "backgroundColor": "#0b0f18"
            },
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          cat capacitor.config.json

      - name: ➕ افزودن پلتفرم اندروید
        run: npx cap add android

      - name: 🔄 همگام‌سازی فایل‌های وب
        run: npx cap sync android

      - name: 🔨 ساخت APK دیباگ
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 آپلود APK به‌عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🏷️ ایجاد/به‌روزرسانی Release v1.1.0 با APK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          echo "📦 APK exists?"
          ls -la android/app/build/outputs/apk/debug/

          # اگه release وجود نداره، با tag ساده بسازش
          echo "🔍 Checking release..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v1.1.0")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Creating release..."
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${{ github.repository }}/releases" \
              -d "{\"tag_name\":\"v1.1.0\",\"name\":\"بازی ماجراجویی v1.1.0\",\"body\":\"نسخه ۱.۱.۰ — بازی به‌روزرسانی شده با محتوای جدید\",\"draft\":false,\"prerelease\":false}" \
              > /dev/null
          fi

          # پیدا کردن release ID
          RELEASE_ID=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v1.1.0" \
            | grep -oE '"id": *[0-9]+' | head -1 | grep -oE '[0-9]+')

          echo "Release ID: $RELEASE_ID"

          # آپلود APK
          echo "🚀 Uploading APK..."
          HTTP=$(curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$APK" \
            -o /dev/null \
            -w "%{http_code}" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=app-debug.apk")

          echo "Upload HTTP: $HTTP"
          [ "$HTTP" = "201" ] && echo "✅ Done!" || (echo "❌ Failed"; exit 1)
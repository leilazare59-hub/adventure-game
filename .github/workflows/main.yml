name: Build Android APK

on:
  # با هر push روی main یا branch جلسه
  push:
    branches:
      - main
      - arena/**
  # با هر pull request
  pull_request:
    branches:
      - main
  # اجرای دستی از تب Actions
  workflow_dispatch:

jobs:
  build:
    name: ساخت APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4

      - name: 🟢 نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📂 ساخت پوشه dist و کپی index.html
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          # اگه فایل manifest یا آیکن لازم بود همین‌جا کپی کن
          for f in manifest.webmanifest icon-192.png apple-touch-icon.png icon-512.png icon-512-maskable.png; do
            if [ -f "$f" ]; then cp "$f" "dist/$f"; fi
          done
          ls -la dist/

      - name: 📦 نصب Capacitor
        run: |
          npm init -y > /dev/null
          npm install --save @capacitor/core@^6 @capacitor/android@^6 @capacitor/cli@^6
          npx cap --version

      - name: ⚙️ ساخت فایل تنظیمات Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "ir.artam.adventuregame",
            "appName": "بازی ماجراجویی",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": true,
              "backgroundColor": "#0b0f18"
            },
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          cat capacitor.config.json

      - name: ➕ افزودن پلتفرم اندروید
        run: npx cap add android

      - name: 🔄 همگام‌سازی فایل‌های وب
        run: npx cap sync android

      - name: 🔨 ساخت APK دیباگ
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 آپلود APK به‌عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🏷️ ایجاد/به‌روزرسانی Release v1.0.0 با APK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ls -la "$APK"

          # بررسی وجود release
          if gh release view v1.0.0 > /dev/null 2>&1; then
            echo "Release exists — updating..."
            # حذف asset قدیمی اگه هست
            gh release delete-asset v1.0.0 app-debug.apk 2>/dev/null || true
            # اضافه کردن asset جدید
            gh release upload v1.0.0 "$APK" --clobber
          else
            echo "Creating new release..."
            gh release create v1.0.0 "$APK" \
              --title "بازی ماجراجویی — نسخه ۱.۰.۰" \
              --notes "نسخه ۱.۰.۰ بازی ماجراجویی. APK به‌صورت خودکار توسط GitHub Actions ساخته شده است."
          fi

          echo "✅ Release updated successfully"
          gh release view v1.0.0